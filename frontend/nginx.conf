server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 默认请求体上限（TASK-004）：普通 JSON API 1 MiB——
    # 视频/封面上传由下方专用 location 覆盖，保持原有业务容量。
    client_max_body_size 1m;

    # API 代理
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传：请求体不落 Nginx 临时文件，避免磁盘容量瓶颈
        proxy_request_buffering off;
        # 上传/响应超时放宽到 600 秒以上
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 视频媒体端点：关闭响应缓冲，保留 Range / Content-Range / Accept-Ranges 头
    location /api/v1/media/ {
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 教师上传视频：保持 512 MiB（略高于应用层 500 MiB 限制以容纳 multipart 开销）
    location ~ ^/api/v1/lessons/[0-9]+/video-file$ {
        client_max_body_size 512m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 课程封面上传：6 MiB（略高于应用层 5 MiB 限制以容纳 multipart 开销）
    location ~ ^/api/v1/courses/[0-9]+/cover$ {
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://api:8000/api/v1/health/live;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
