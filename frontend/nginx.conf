server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 全局默认：普通 JSON API 请求体上限 1 MiB，超限返回 413
    client_max_body_size 1m;

    # API 代理（保持请求体缓冲，使 client_max_body_size 在边界生效）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传/响应超时放宽到 600 秒以上
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 教师视频上传：512 MiB（与后端 500 MiB 业务限额 + multipart 开销一致）。
    # 大文件上传：请求体不落 Nginx 临时文件，避免磁盘容量瓶颈
    location ~ ^/api/v1/lessons/[0-9]+/video-file$ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 课程封面上传：6 MiB（与后端 5 MiB 业务限额 + multipart 开销一致）
    location ~ ^/api/v1/courses/[0-9]+/cover$ {
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Studio 模板导入：50 MiB（与后端 studio_service.MAX_IMPORT_BYTES 一致）
    location ~ ^/api/v1/studio/templates/(import|[0-9]+/import)$ {
        client_max_body_size 50m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 视频媒体端点：关闭响应缓冲，保留 Range / Content-Range / Accept-Ranges 头
    location /api/v1/media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://api:8000/api/v1/health/live;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
